<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaflet Test</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      color: #0f172a;
      background: #f8fbff;
    }

    #map {
      height: 60vh;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(2,10,20,0.08);
    }
  </style>
</head>
<body>

<h2>My Test Map</h2>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof L === 'undefined') {
      console.error('Leaflet failed to load.');
      return;
    }

    const map = L.map('map').setView([39.8283, -98.5795], 4); // center of USA by default

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // Example marker (adjust coordinates as needed)
    L.marker([41.8781, -87.6298]).addTo(map) // Chicago
      .bindPopup("Package location: Chicago, IL")
      .openPopup();

    // Ensure map renders correctly if container size changes
    setTimeout(() => { map.invalidateSize(); }, 300);
  });
</script>

<noscript>
  <p>Please enable JavaScript to view the interactive map.</p>
</noscript>

</body>
</html>
